<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- ব্যাকগ্রাউন্ড গ্রেডিয়েন্ট -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
    <!-- গোল্ডেন আইকন গ্রেডিয়েন্ট -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f3bd" />
      <stop offset="100%" stop-color="#05668d" />
    </linearGradient>
  </defs>

  <!-- ব্যাকগ্রাউন্ড শেপ (রাউন্ডেড স্কয়ার) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- বাইরের গ্লোয়িং রিং -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="12" />

  <!-- স্মার্টফোন ফ্রেম -->
  <rect x="156" y="96" width="200" height="320" rx="28" fill="#ffffff" />
  <!-- মোবাইল স্ক্রিন -->
  <rect x="168" y="126" width="176" height="250" rx="12" fill="#028090" />
  <!-- স্পিকার ইয়ারপিস -->
  <rect x="226" y="108" width="60" height="6" rx="3" fill="#e0e0e0" />

  <!-- রেঞ্চ / টুল আইকন (মোবাইলের ভেতরে সার্ভিসিং সিম্বল) -->
  <g transform="translate(256, 251) scale(1.1)">
    <!-- সার্কিট / টুল এর বাইরের বল্টু -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ffffff" stroke-width="12" />
    <!-- রেঞ্চ মাথা -->
    <path d="M-20,-20 L-45,-45 C-55,-55 -40,-70 -30,-60 L-10,-40 Z" fill="#ffffff" />
    <path d="M20,20 L45,45 C55,55 40,70 30,60 L10,40 Z" fill="#ffffff" />
    <!-- ভেতরের ডট -->
    <circle cx="0" cy="0" r="16" fill="#f0f3bd" />
  </g>

  <!-- হোম বাটন মেটালিক ইন্ডিকেটর -->
  <circle cx="256" cy="392" r="10" fill="#028090" />
</svg>
